services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-finance-app
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-postgres}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:?DB_DATABASE must be set in .env}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME must be set in .env}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: personal-finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:?DB_DATABASE must be set in .env}"
      POSTGRES_USER: "${DB_USERNAME:?DB_USERNAME must be set in .env}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  vite:
    image: node:22-alpine
    container_name: personal-finance-vite
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data: